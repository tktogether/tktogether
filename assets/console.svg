<svg xmlns="http://www.w3.org/2000/svg" width="1012" height="300" viewBox="0 0 1012 300" role="img" aria-labelledby="title desc">
  <title id="title">System console — tktogether-node boot sequence</title>
  <desc id="desc">Boot log: kernel handshake complete, gateway uplink established, warden modules mounted, node registry synced.</desc>
  <defs>
    <style>
      .mono { font-family: Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace; }
      .line { animation: linein 0.01s linear both; }
      .l1 { animation-delay: 0.2s; }
      .l2 { animation-delay: 0.7s; }
      .l3 { animation-delay: 1.2s; }
      .l4 { animation-delay: 1.7s; }
      .l5 { animation-delay: 2.2s; }
      .l6 { animation-delay: 2.9s; }
      .cursor { animation: blink 1.1s steps(1, end) infinite; }
      @keyframes linein { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .line, .cursor { animation: none; }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1011" height="299" fill="#070C12" stroke="#35E0F0" stroke-opacity="0.25"/>
  <rect x="0" y="0" width="1012" height="34" fill="#0A1218"/>
  <line x1="0" y1="34" x2="1012" y2="34" stroke="#35E0F0" stroke-opacity="0.2"/>
  <text x="16" y="22" class="mono" font-size="11" letter-spacing="2" fill="#9FB4B8">SYSTEM CONSOLE // tktogether-node</text>
  <g fill="none" stroke="#35E0F0" stroke-opacity="0.3">
    <rect x="948" y="13" width="8" height="8"/>
    <rect x="966" y="13" width="8" height="8"/>
    <rect x="984" y="13" width="8" height="8"/>
  </g>

  <g class="mono" font-size="15">
    <g class="line l1">
      <text x="24" y="68"><tspan fill="#35E0F0">&gt; </tspan><tspan fill="#E8F6F8">boot tktogether-node</tspan></text>
    </g>
    <g class="line l2">
      <text x="24" y="98"><tspan fill="#7CF0B0">[ OK ]</tspan><tspan fill="#9FB4B8"> kernel handshake </tspan><tspan fill="#5E7478">.................</tspan><tspan fill="#9FB4B8"> complete</tspan></text>
    </g>
    <g class="line l3">
      <text x="24" y="128"><tspan fill="#7CF0B0">[ OK ]</tspan><tspan fill="#9FB4B8"> gateway uplink established</tspan></text>
    </g>
    <g class="line l4">
      <text x="24" y="158"><tspan fill="#7CF0B0">[ OK ]</tspan><tspan fill="#9FB4B8"> warden modules mounted</tspan></text>
    </g>
    <g class="line l5">
      <text x="24" y="188"><tspan fill="#7CF0B0">[ OK ]</tspan><tspan fill="#9FB4B8"> node registry synced (28 entries)</tspan></text>
    </g>
    <g class="line l6">
      <text x="24" y="218" fill="#35E0F0">&gt;</text>
      <rect class="cursor" x="42" y="203" width="9" height="16" fill="#35E0F0" fill-opacity="0.8"/>
    </g>
  </g>
</svg>
