<svg xmlns="http://www.w3.org/2000/svg" width="1012" height="260" viewBox="0 0 1012 260" role="img" aria-labelledby="title desc">
  <title id="title">模块分布 — 语言体量</title>
  <desc id="desc">9 个公开原创仓库的代码体量占比：TypeScript 51.5%, Go 22.9%, Shell 9.6%, Rust 7.3%, Vue 2.8%, 其他 5.9%。</desc>
  <rect x="0.5" y="0.5" width="1011" height="259" fill="#070C12" stroke="#35E0F0" stroke-opacity="0.25"/>
  <text x="24" y="34" font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', 'Microsoft YaHei', monospace" font-size="9" letter-spacing="3" fill="#35E0F0" fill-opacity="0.8">模块分布</text>
  <text x="24" y="64" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="600" fill="#E8F6F8">语言体量</text>
  <text x="988" y="34" text-anchor="end" font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', 'Microsoft YaHei', monospace" font-size="9" letter-spacing="1.6" fill="#5E7478">9 个公开原创 · 实时</text>
  <text x="988" y="58" text-anchor="end" font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', 'Microsoft YaHei', monospace" font-size="9" letter-spacing="1.6" fill="#5E7478">5 种语言 + 其他</text>
