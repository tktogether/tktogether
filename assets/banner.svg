<svg xmlns="http://www.w3.org/2000/svg" width="1012" height="560" viewBox="0 0 1012 560" role="img" aria-labelledby="title desc">
  <title id="title">TKTOGETHER — Gateway Operator · Node Network</title>
  <desc id="desc">Cinematic sci-fi hero: oversized TKTOGETHER wordmark, gateway portal, perspective grid floor.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="810" cy="250" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35E0F0" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#35E0F0" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#35E0F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35E0F0" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#35E0F0" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#35E0F0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060A" stop-opacity="0"/>
      <stop offset="1" stop-color="#04060A" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#35E0F0" opacity="0.035"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <style>
      .rot60, .rot45r, .rot90, .pulse, .sweep {
        transform-box: fill-box;
        transform-origin: center;
      }
      .rot60 { animation: spin 60s linear infinite; }
      .rot45r { animation: spinr 45s linear infinite; }
      .rot90 { animation: spin 90s linear infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .sweep { animation: sweep 9s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spinr { to { transform: rotate(-360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      @keyframes sweep { 0%, 100% { transform: translateY(-18px); opacity: 0; } 50% { transform: translateY(18px); opacity: 0.8; } }
      @media (prefers-reduced-motion: reduce) {
        .rot60, .rot45r, .rot90, .pulse, .sweep { animation: none; }
      }
    </style>
  </defs>

  <rect width="1012" height="560" fill="#04060A"/>
  <rect width="1012" height="560" fill="url(#bgGlow)"/>

  <g fill="#EAF7F9">
    <circle cx="80" cy="70" r="1.1" opacity="0.4"/>
    <circle cx="150" cy="150" r="0.8" opacity="0.25"/>
    <circle cx="230" cy="60" r="1.2" opacity="0.35"/>
    <circle cx="310" cy="120" r="0.7" opacity="0.2"/>
    <circle cx="390" cy="50" r="1" opacity="0.3"/>
    <circle cx="470" cy="170" r="0.8" opacity="0.25"/>
    <circle cx="540" cy="80" r="1.1" opacity="0.35"/>
    <circle cx="610" cy="150" r="0.7" opacity="0.2"/>
    <circle cx="690" cy="40" r="1" opacity="0.3"/>
    <circle cx="860" cy="55" r="1.2" opacity="0.4"/>
    <circle cx="930" cy="150" r="0.8" opacity="0.25"/>
    <circle cx="980" cy="80" r="1" opacity="0.3"/>
    <circle cx="60" cy="300" r="0.8" opacity="0.25"/>
    <circle cx="200" cy="340" r="1" opacity="0.3"/>
    <circle cx="350" cy="300" r="0.7" opacity="0.2"/>
    <circle cx="500" cy="380" r="1.1" opacity="0.35"/>
    <circle cx="640" cy="330" r="0.8" opacity="0.25"/>
    <circle cx="960" cy="320" r="0.9" opacity="0.28"/>
  </g>

  <g stroke="#35E0F0" stroke-opacity="0.08">
    <path d="M-200 560 L760 420 M-80 560 L760 420 M40 560 L760 420 M160 560 L760 420 M280 560 L760 420 M400 560 L760 420 M520 560 L760 420 M640 560 L760 420 M760 560 L760 420 M880 560 L760 420 M1000 560 L760 420 M1120 560 L760 420 M1240 560 L760 420"/>
    <path d="M0 420 H1012 M0 436 H1012 M0 456 H1012 M0 480 H1012 M0 510 H1012 M0 548 H1012"/>
  </g>
  <rect x="0" y="400" width="1012" height="160" fill="url(#floorFade)"/>

  <text x="56" y="190" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="210" font-weight="700" letter-spacing="-8" fill="none" stroke="#35E0F0" stroke-opacity="0.07">GATEWAY</text>

  <g font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="86" font-weight="700" letter-spacing="2">
    <text x="52" y="252" fill="#FF3D81" fill-opacity="0.35">TKTOGETHER</text>
    <text x="60" y="256" fill="#35E0F0" fill-opacity="0.35">TKTOGETHER</text>
    <text x="56" y="254" fill="#EAF7F9">TKTOGETHER</text>
  </g>

  <line x1="56" y1="286" x2="420" y2="286" stroke="#35E0F0" stroke-opacity="0.7"/>
  <text x="56" y="316" font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace" font-size="13" letter-spacing="4" fill="#35E0F0">GATEWAY OPERATOR // NODE NETWORK</text>

  <g font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace">
    <circle class="pulse" cx="62" cy="362" r="4" fill="#7CF0B0"/>
    <text x="78" y="367" font-size="11" letter-spacing="2.5" fill="#7CF0B0">NODE // ONLINE</text>
    <text x="220" y="367" font-size="11" letter-spacing="2" fill="#5E7478">SINCE 2022.11.17</text>
    <text x="56" y="466" font-size="10" letter-spacing="2" fill="#5E7478">SYS.01 // GATEWAY CONTROL</text>
  </g>

  <line x1="0" y1="510" x2="1012" y2="510" stroke="#35E0F0" stroke-opacity="0.25"/>
  <text x="24" y="536" font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace" font-size="10" letter-spacing="2" fill="#5E7478">GATEWAY OPERATOR · NODE NETWORK · SIGNAL STABLE</text>
  <text x="988" y="536" text-anchor="end" font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace" font-size="10" letter-spacing="2" fill="#35E0F0" fill-opacity="0.6">EST. 2022</text>

  <g stroke="#35E0F0" stroke-opacity="0.14" stroke-width="1">
    <line x1="660" y1="-20" x2="1020" y2="240"/>
