    <path d="M959.8 258.4 A160 160 0 0 1 887.1 384.2 L841.4 313.7 A76 76 0 0 0 875.9 254.0 Z"/>
    <path d="M872.6 392.6 A160 160 0 0 1 727.4 392.6 L765.5 317.7 A76 76 0 0 0 834.5 317.7 Z"/>
    <path d="M712.9 384.2 A160 160 0 0 1 640.2 258.4 L724.1 254.0 A76 76 0 0 0 758.6 313.7 Z"/>
    <path d="M640.2 241.6 A160 160 0 0 1 712.9 115.8 L758.6 186.3 A76 76 0 0 0 724.1 246.0 Z"/>
    <path d="M727.4 107.4 A160 160 0 0 1 872.6 107.4 L834.5 182.3 A76 76 0 0 0 765.5 182.3 Z"/>
    <path d="M887.1 115.8 A160 160 0 0 1 959.8 241.6 L875.9 246.0 A76 76 0 0 0 841.4 186.3 Z"/>
  </g>

  <rect x="796" y="70" width="8" height="360" fill="url(#beamGrad)"/>

  <g fill="none" stroke="#35E0F0">
    <circle cx="800" cy="250" r="64" stroke-opacity="0.55"/>
    <circle cx="800" cy="250" r="52" stroke-opacity="0.2"/>
  </g>

  <polygon points="800,206 838,228 838,272 800,294 762,272 762,228" fill="#04060A" stroke="#35E0F0" stroke-opacity="0.6"/>
  <polygon points="800,222 825,236 825,264 800,278 775,264 775,236" fill="#35E0F0" fill-opacity="0.10" stroke="#35E0F0" stroke-opacity="0.3"/>
  <circle cx="800" cy="250" r="12" fill="#EAFDFF" fill-opacity="0.5" filter="url(#softGlow)"/>
  <circle cx="800" cy="250" r="3" fill="#EAFDFF"/>

  <g class="sweep" opacity="0.8">
