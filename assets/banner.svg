<svg xmlns="http://www.w3.org/2000/svg" width="1012" height="560" viewBox="0 0 1012 560" role="img" aria-labelledby="title desc">
  <title id="title">tktogether — Gateway Operator · Node Network</title>
  <desc id="desc">Cinematic sci-fi hero: oversized tktogether wordmark, gateway portal, perspective grid floor.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="810" cy="250" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35E0F0" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#35E0F0" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#35E0F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35E0F0" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#35E0F0" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#35E0F0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060A" stop-opacity="0"/>
      <stop offset="1" stop-color="#04060A" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#35E0F0" opacity="0.035"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <style>
      .rot60, .rot45r, .rot90, .pulse, .sweep {
        transform-box: fill-box;
        transform-origin: center;
      }
      .rot60 { animation: spin 60s linear infinite; }
      .rot45r { animation: spinr 45s linear infinite; }
      .rot90 { animation: spin 90s linear infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .sweep { animation: sweep 9s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spinr { to { transform: rotate(-360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      @keyframes sweep { 0%, 100% { transform: translateY(-18px); opacity: 0; } 50% { transform: translateY(18px); opacity: 0.8; } }
      @media (prefers-reduced-motion: reduce) {
        .rot60, .rot45r, .rot90, .pulse, .sweep { animation: none; }
      }
    </style>
  </defs>

