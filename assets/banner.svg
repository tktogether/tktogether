  <title id="title">TKTOGETHER — Gateway Operator · Node Network</title>
  <desc id="desc">Dark sci-fi hero banner: TKTOGETHER wordmark, gateway HUD ring, node online status.</desc>
  <defs>
    <radialGradient id="glow" cx="760" cy="330" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35E0F0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#35E0F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="portal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#35E0F0" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#35E0F0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid40" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#35E0F0" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="grid160" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M160 0H0V160" fill="none" stroke="#35E0F0" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <style>
      .rot60, .rot45r, .rot90, .pulse {
        transform-box: fill-box;
        transform-origin: center;
      }
      .rot60 { animation: spin 60s linear infinite; }
      .rot45r { animation: spinr 45s linear infinite; }
      .rot90 { animation: spin 90s linear infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spinr { to { transform: rotate(-360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .rot60, .rot45r, .rot90, .pulse { animation: none; }
      }
    </style>
  </defs>

