  </g>

  <rect width="1012" height="560" fill="url(#scan)"/>

  <g fill="none" stroke="#35E0F0" stroke-opacity="0.5" stroke-width="1">
    <path d="M0 26 V0 H26"/>
    <path d="M986 0 H1012 V26"/>
    <path d="M0 534 V560 H26"/>
    <path d="M986 560 H1012 V534"/>
