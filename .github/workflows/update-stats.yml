name: Update profile stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: tktogether
        run: python scripts/generate_stats.py

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            # GitHub disables scheduled workflows after 60 days without repo
            # activity. Touch a heartbeat file when the repo has been idle for
            # 45 days so the schedule keeps running.
            last=$(git log -1 --format=%ct)
            now=$(date +%s)
            if [ $(( (now - last) / 86400 )) -ge 45 ]; then
              date -u +%Y-%m-%d > .github/stats-heartbeat.txt
              git add .github/stats-heartbeat.txt
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "chore: keep stats workflow active"
              git push
              exit 0
            fi
            echo "No stats changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg assets/stack.svg
          git commit -m "chore: update profile stats"
          git push
